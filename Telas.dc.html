<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#E7E3DE;font-family:'Onest',system-ui,sans-serif;color:#1C1917}
a{color:#1C1917}
a:hover{color:#8A3B12}
</style>
</helmet>
<section style="padding:48px;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-size:28px;font-weight:700;letter-spacing:-.01em">Brasa Burger — telas do app de pedidos</div>
    <div style="font-size:15px;color:#57504A">Cada tela é o app real, aberto num estado diferente. Tudo é clicável.</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
    <sc-for list="{{ telas }}" as="t" hint-placeholder-count="10">
      <div id="{{ t.id }}" style="display:flex;flex-direction:column;gap:12px;width:390px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="height:26px;padding:0 10px;border-radius:13px;background:#1C1917;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center">{{ t.id }}</span>
          <span style="font-size:15px;font-weight:600">{{ t.titulo }}</span>
        </div>
        <div style="width:390px;height:844px;border-radius:44px;overflow:hidden;transform:translateZ(0);background:#F7F4F0;box-shadow:0 0 0 8px #1C1917,0 30px 60px -20px rgba(0,0,0,.35)">
          <div style="height:100%;overflow-y:auto">
            <dc-import name="AppPedidos" cena="{{ t.cena }}" hint-size="390px,844px"></dc-import>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const T = [
      ['home', 'Home'], ['home-repetir', 'Home com último pedido'], ['fechado', 'Home — loja fechada'],
      ['produto', 'Produto — Monte do seu jeito'], ['sacola', 'Sacola completa'], ['sacola-cupom', 'Sacola — cupom aplicado'],
      ['sacola-cupom-invalido', 'Sacola — cupom inválido'], ['sacola-retirada', 'Sacola — retirada no local'],
      ['sacola-fechado', 'Sacola — agendar pedido'], ['enviado', 'Pedido enviado']
    ];
    return { telas: T.map(([cena, titulo], i) => ({ id: '1' + 'abcdefghij'[i], cena, titulo })) };
  }
}
</script>
</body>
</html>
